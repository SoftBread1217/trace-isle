<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>手机接收器 · 迹屿</title><meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="style.css?v=4"><script defer src="vendor/peerjs.min.js"></script><script type="module" src="receive.js?v=4"></script></head>
<body><header class="top"><div class="wrap top-inner"><span class="brand">迹屿 <small>TRACE ISLE</small></span></div></header>
<main class="wrap handset"><h1>手机接收器</h1><p id="connection" role="status">正在连接电脑…</p>
<section class="panel receiver"><div class="panel-head"><h2>测试位置</h2><span class="tag" id="mode">等待数据</span></div>
<dl class="readings"><div><dt>纬度</dt><dd id="lat">—</dd></div><div><dt>经度</dt><dd id="lon">—</dd></div>
<div><dt>已走距离</dt><dd id="distance">—</dd></div><div><dt>当前配速</dt><dd id="pace">—</dd></div></dl><p id="stamp">等待电脑发送</p></section>
<p>此页显示电脑回放的模拟位置。请保持页面在前台。</p><button type="button" id="retry" hidden>重新连接</button></main></body></html>
