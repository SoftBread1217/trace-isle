<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="在地图上设置固定点或规划动态轨迹，通过 Windows USB 助手将模拟位置同步到 iPhone。">
  <meta name="theme-color" content="#F8FAFC">
  <title>迹屿 · iOS 虚拟定位与动态轨迹模拟工具</title>
  <link rel="icon" href="./isle.svg?v=10" type="image/svg+xml">
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <link rel="stylesheet" href="./style.css?v=15">
  <script defer src="./vendor/leaflet.js"></script>
  <script type="module" src="./app.js?v=14"></script>
</head>
<body>
  <header class="top"><div class="wrap top-inner">
    <a class="brand" href="./"><img src="./isle.svg?v=10" width="30" height="30" alt=""><span>迹屿 <small>Trace Isle</small></span></a>
    <h1>iOS 虚拟定位</h1>
    <a class="guide-link" href="./guide.html" target="_blank" rel="noopener">使用说明</a>
    <button id="usb-trigger" class="device-button" type="button" aria-haspopup="dialog" aria-controls="usb-dialog"><span class="phone-icon" aria-hidden="true"></span>iPhone <span id="usb-indicator" role="status">USB 设置</span></button>
  </div></header>
  <main class="wrap">
    <section class="finder" aria-label="查找学校操场">
      <div class="search-row"><form id="school-search">
        <label for="school-query" class="sr-only">学校或校区</label>
        <div class="search-box"><span class="search-icon" aria-hidden="true"></span><input id="school-query" type="search" placeholder="搜索学校或校区" maxlength="80" required></div><button class="primary">搜索</button>
      </form>
      <div class="presets" aria-label="路线预设"><span>预设</span><button id="stadium" type="button" class="chip">陵水体育场</button><button id="example" type="button" class="chip">伦敦玛丽女王大学</button></div></div>
      <div id="school-results" class="choices"></div>
      <p id="school-status" role="status" class="helper"></p>
    </section>
    <dialog id="usb-dialog" aria-labelledby="usb-title">
      <div class="share-form"><div class="dialog-head"><h2 id="usb-title">更改 iPhone 系统定位</h2><form method="dialog"><button class="dismiss" aria-label="关闭 iPhone 设置">×</button></form></div>
      <p id="usb-help">第一次使用？在 Windows 电脑上下载并解压助手。启动助手、用数据线接好 iPhone 后，打开本机控制台。</p>
      <a id="usb-download" href="./downloads/Trace-Isle-Windows-USB.zip" download>下载 Windows USB 助手（ZIP）</a>
      <button id="usb-open" type="button">打开本机 USB 控制台</button>
      <a href="./guide.html" target="_blank" rel="noopener">安装、连接与常见问题</a>
      <div id="usb-local" class="transport" hidden><button id="usb-clear" type="button" disabled>恢复真实定位</button></div>
      <p id="usb-status" class="helper" role="status"></p></div>
    </dialog>
    <div class="workspace">
      <section class="panel route-panel" aria-label="路线地图">
        <div id="field-picker" hidden>
          <div class="panel-head"><h2 id="campus-title"></h2><button type="button" id="back-route">返回路线</button></div>
          <div class="choices" id="field-results"></div>
          <button id="field-manual" type="button">在地图上指定操场</button>
          <div class="map-box"><div id="campus-map" aria-label="操场与模拟路线地图"></div><span class="map-hint" id="campus-map-status" role="status"></span></div>
          <div id="field-preview" hidden><strong id="field-length"></strong><p id="field-guide" class="helper"></p>
          <div class="finder-actions"><button id="use-field" type="button">使用这条跑道</button><button id="edit-template" type="button">调整为估算模板</button></div></div>
        </div>
        <div id="route-editor">
        <div class="panel-head"><div><h2 id="route-title">路线地图</h2><p id="route-name"></p></div>
        <div class="finder-actions"><button type="button" id="choose-manual">指定操场</button></div></div>
        <div class="mode-switch" role="group" aria-label="定位模式">
          <button id="route-mode" type="button" aria-pressed="true">动态轨迹</button>
          <button id="pick-fixed" type="button" aria-pressed="false">固定点定位</button>
        </div>
        <div class="map-box"><div id="map" aria-label="可缩放的路线地图"></div><div id="map-hint" class="map-hint" hidden></div></div>
        <div class="map-footer"><label><input id="basemap" type="checkbox" checked> 在线底图</label><span id="map-status" role="status"></span><span id="point-count">0 个点</span></div>
        <details class="custom-route"><summary>自定义路线</summary><div class="toolbar" aria-label="路线编辑">
          <button id="draw" type="button" aria-pressed="false">地图画轨迹</button>
          <button id="close-route" type="button" disabled>闭合路线</button>
          <button id="undo" type="button">撤销</button>
          <button id="clear" type="button">清空</button>
          <button id="import" type="button">导入 GPX</button><input id="gpx" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden>
          <button id="export" type="button">导出 GPX</button>
        </div>
        </details>
        <details class="coordinate-entry"><summary>定位设置 · 输入经纬度</summary>
          <form id="coordinate-form" class="coordinate-form">
            <label>纬度<input id="latitude" type="number" min="-90" max="90" step="any" required inputmode="decimal"></label>
            <label>经度<input id="longitude" type="number" min="-180" max="180" step="any" required inputmode="decimal"></label>
            <div class="coordinate-actions">
              <button id="apply-fixed" type="submit">选用此坐标</button>
              <button id="add-point" type="submit">添加到路线</button>
            </div>
          </form>
        </details></div>
      </section>
      <aside class="side" aria-label="模拟控制与当前位置">
        <section class="panel player" aria-labelledby="player-title">
          <div class="panel-head"><h2 id="player-title">动态模拟</h2><span id="state" class="state" role="status">就绪</span></div>
          <div class="stats"><div><span>路线原长</span><strong id="total-distance">—</strong></div><div><span>剩余时间</span><strong id="total-time">—</strong></div></div>
          <div class="settings">
            <label>目标距离（公里）<input id="target" type="number" min="0.001" max="1000" step="0.001" inputmode="decimal" placeholder="按路线原长"></label>
            <label>跑步配速（分:秒/km）<input id="pace" type="text" value="6:00" maxlength="5" spellcheck="false"></label>
          </div>
          <p class="helper" id="trip-hint"></p><p class="helper error" id="setting-error" role="status"></p>
          <label class="progress-label" for="progress"><span>路线进度</span><span id="elapsed">已用 00:00</span></label>
          <progress id="progress" class="progress" max="1000" value="0"></progress>
          <div class="transport playback"><button id="play" class="primary" type="button">开始模拟</button><button id="reset" type="button">重置</button></div>
        </section>
        <section id="receiver" class="panel receiver" aria-labelledby="receiver-title">
          <div class="panel-head"><h2 id="receiver-title">定位状态</h2><span class="tag" id="output-state" role="status">尚未同步</span></div>
          <dl class="readings"><div><dt>纬度</dt><dd id="lat-readout">—</dd></div><div><dt>经度</dt><dd id="lon-readout">—</dd></div><div><dt>累计距离</dt><dd id="distance-readout">—</dd></div><div><dt>当前配速</dt><dd id="speed-readout">—</dd></div></dl>

        </section>
      </aside>
    </div>
    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
    <footer><span>迹屿 · Trace Isle</span><span>校园与场地数据 © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap 贡献者</a> · <a href="./guide.html#data" target="_blank" rel="noopener">数据说明</a></span></footer>
  </main>
  <noscript>请启用 JavaScript 以使用迹屿。</noscript>
</body>
</html>
